<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: Arial, sans-serif; width: 300px; padding: 14px; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { font-size: 12px; color: #555; display: block; margin: 10px 0 4px; }
  input { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
  button { margin-top: 12px; width: 100%; padding: 8px; background: #1a73e8; color: #fff; border: 0; border-radius: 5px; cursor: pointer; }
  #status { font-size: 12px; margin-top: 10px; }
  .preview { margin-top: 12px; border: 1px dashed #ddd; border-radius: 5px; padding: 8px; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
  <h1>Entity Signature</h1>
  <label>Backend URL</label>
  <input id="api" placeholder="http://localhost:8000" />
  <button id="save">Save & Test</button>
  <div id="status"></div>
  <div id="preview" class="preview" style="display:none"></div>
  <script src="popup.js"></script>
</body>
</html>
