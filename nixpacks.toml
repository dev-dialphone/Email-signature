# Nixpacks build config for Coolify.
# The FastAPI app lives in app/ and is served by uvicorn on $PORT (Coolify sets it).
[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt"]

[start]
cmd = "/opt/venv/bin/python -m uvicorn backend.main:app --app-dir app --host 0.0.0.0 --port ${PORT:-3000}"
